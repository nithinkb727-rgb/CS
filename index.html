<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS Quiz App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Computer Science Quiz</h1>
        <p class="subtitle">Test your fundamentals in algorithms, systems, and web.</p>
      </header>

      <section id="quiz-card" class="card">
        <div class="quiz-meta">
          <span id="question-progress">Question 1 / 8</span>
          <span id="score">Score: 0</span>
        </div>

        <h2 id="question-text">Loading question...</h2>
        <div id="answer-buttons" class="answers" aria-live="polite"></div>

        <div class="actions">
          <button id="next-btn" class="btn" disabled>Next</button>
          <button id="restart-btn" class="btn ghost" hidden>Restart</button>
        </div>
      </section>

      <footer>
        <small>Built with vanilla HTML, CSS, and JavaScript.</small>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
